# need to rewrite this so bad
name: Mizu
main: net.approachcircle.plugin.Mizu
description: a plugin containing useful features and functions
version: 1.0
api-version: 1.19
author: approachcircle
prefix: Mizu
website: https://approachcircle.site


commands: 
  die:
    description: kills the player
  tpa:
    description: sends a teleport request to another player
  mock:
    description: sends a fake message appearing to come from another player
  spawnon:
    description: spawns an entity on another player
  maintenance:
    description: puts the server into maintenance mode that kicks every player who is not an operator, and only allows operators to join back
  firework:
    description: gives a stack of fireworks every 5 minutes
  test-sentry:
    description: tests sentry notifications
  gamble:
    description: allows you to gamble a specified amount of materials, mobs, experience or health
  test-notifications:
    description: tests lucky chunk discord notifications
  spawn-chunk-now:
    description: immediately spawns the lucky chunk, with the ability to pass in a custom block
  remove-chunk-now:
    description: immediately removes the lucky chunk
  lc:
    description: queries the time until the next lucky chunk, or until the current chunk disappears
  mizu-reload-config:
    description: reloads the configuration
  tpy:
    description: accepts a teleport request
  tpn:
    description: rejects a teleport request
  fuck-you:
    description: applies an assortment of debuffs to a user with a title screen saying "fuck you"
  warp:
    description: allows you to teleport to set coordinates within the map. these teleports can be removed, added, updated or renamed
  stats:
    description: displays statistics on the most used commands globally or by the player
  lctp:
    description: teleports you to the lucky chunk if has been found or the player is an operator
  vault:
    description: opens the players personal vault
   
permissions:
  mizu.*:
    description: access to every Mizu feature
    children:
      mizu.die: true
      mizu.firework: true
      mizu.maintenance: true
      mizu.tpa: true
      mizu.spawnon: true
      mizu.mock: true
      mizu.magicwand: true
      mizu.test-sentry: true
      mizu.test-notifications: true
      mizu.gamble: true
      mizu.spawn-chunk-now: true
      mizu.remove-chunk-now: true
      mizu.lc: true
      mizu.mizu-reload-config: true
      mizu.fuck-you: true
      mizu.warp: true
      mizu.stats: true
      mizu.lctp: true
      mizu.vault: true
      mizu.party: true

  mizu.die:
    description: allows a user to kill themselves
    default: true
  mizu.firework:
    description: allows a user to receive a set amount of fireworks after a set cooldown
    default: true
  mizu.maintenance:
    description: allows a user to toggle maintenance mode for the server
    default: op
  mizu.tpa:
    description: allows a user to request to teleport to another user
    default: true
  mizu.spawnon:
    description: allows a user to spawn a mob of their choosing inside of another player
    default: op
  mizu.mock:
    description: allows a user to disguise a message to appear to come from another user
    default: true
  mizu.magicwand:
    description: allows a user to use the magic wand
    default: op
  mizu.test-sentry:
    description: allows a user to throw a test exception for sentry
    default: op
  mizu.test-notifications:
    description: allows a user to test the notification server
    default: op
  mizu.gamble:
    description: allows a user to gamble a given amount of items for double or nothing
    default: true
  mizu.spawn-chunk-now:
    description: allows a user to immediately spawn a lucky chunk
    default: op
  mizu.remove-chunk-now:
    description: allows a user to immediately remove a lucky chunk
    default: op
  mizu.lc:
    description: allows a user to query the time until the next lucky chunk spawn
    default: true
  mizu.mizu-reload-config:
    description: allows a user to reload the config from disk
    default: op
  mizu.fuck-you:
    description: allows a user to apply loads of negative effects to another player
    default: op
  mizu.warp:
    description: allows a user to warp to a specified player-made warp
    default: true
  mizu.stats:
    description: allows a user to view their most used commands
    default: true
  mizu.lctp:
    description: allows a user to teleport to the lucky chunk when it has been found by at least one person
    default: true
  mizu.vault:
    description: allows a user to open their vault
    default: true
  mizu.party:
    description: allows a user to manage their party
    default: true